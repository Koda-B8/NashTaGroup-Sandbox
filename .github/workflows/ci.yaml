name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm ci

      - run: npx oxfmt --check
      - run: npx oxlint

      - run: npm run test:coverage
      - uses: davelosert/vitest-coverage-report-action@v2
        if: always()
